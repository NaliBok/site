<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minicraft+ в браузере</title>
<style>
  :root { --bg:#14161a; --fg:#e8e6df; --muted:#8d9199; --accent:#6bbf59; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; }
  #gate { position: fixed; inset: 0; z-index: 10; display: grid; place-content: center;
    justify-items: center; gap: 14px; padding: 24px; text-align: center; background: var(--bg); }
  #gate h1 { margin: 0; font-size: clamp(28px, 6vw, 44px); letter-spacing: .01em; }
  #gate p { margin: 0; max-width: 46ch; color: var(--muted); }
  #play { font: inherit; font-weight: 600; padding: 12px 36px; border: 0; border-radius: 4px;
    background: var(--accent); color: #0e1a0b; cursor: pointer; }
  #play:hover { filter: brightness(1.08); }
  #play:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  #play[disabled] { opacity: .6; cursor: progress; }
  #status { min-height: 1.5em; font-size: 14px; color: var(--muted); }
  #status.error { color: #ff8a80; }
  footer { position: fixed; left: 0; right: 0; bottom: 8px; z-index: 11; text-align: center;
    font-size: 12px; color: var(--muted); pointer-events: none; }
  footer a { color: inherit; pointer-events: auto; }
  body.running footer, body.running #gate { display: none; }
</style>
<script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
</head>
<body>
<div id="game"></div>

<div id="gate">
  <h1>Minicraft+</h1>
  <p>Версия 2.3.0-dev2 запускается прямо в браузере. Первый запуск может занять до минуты: игра подгружается по частям. Сохранения лежат в памяти вашего браузера.</p>
  <button id="play" type="button">Играть</button>
  <div id="status" role="status" aria-live="polite"></div>
</div>

<footer>
  Minicraft+ — открытый проект
  (<a href="https://github.com/MinicraftPlus/minicraft-plus-revived" target="_blank" rel="noopener">исходный код</a>),
  запуск через <a href="https://cheerpj.com" target="_blank" rel="noopener">CheerpJ</a>.
</footer>

<script type="module">
  const btn = document.getElementById("play");
  const status = document.getElementById("status");
  const say = (t, err = false) => { status.textContent = t; status.classList.toggle("error", err); };

  // jar лежит рядом с index.html; /app/ в CheerpJ = корень сайта,
  // поэтому путь берём из адреса страницы (работает и на github.io/site/, и на Render).
  const base = location.pathname.replace(/[^/]*$/, "");
  const jar = "/app" + base + "minicraft.jar";

  btn.addEventListener("click", async () => {
    btn.disabled = true;
    say("Запускаю виртуальную машину Java…");
    try {
      await cheerpjInit({
        version: 8,
        // сохранения и настройки идут в постоянное хранилище браузера (IndexedDB)
        javaProperties: ["user.home=/files", "java.awt.headless=false"]
      });
      say("Загружаю игру…");
      document.body.classList.add("running");
      cheerpjCreateDisplay(-1, -1, document.getElementById("game"));
      await cheerpjRunJar(jar);
    } catch (e) {
      document.body.classList.remove("running");
      btn.disabled = false;
      say("Не удалось запустить игру: " + (e && e.message ? e.message : e) + ". Откройте консоль браузера (F12) и пришлите текст ошибки.", true);
      console.error(e);
    }
  });
</script>
</body>
</html>
